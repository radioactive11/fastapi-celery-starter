name: Squark CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE_NAME: asia-south1-docker.pkg.dev/argon-sandbox/argon-2aef86b2/demo-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SA_JSON }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Squark Deployment
        run: |
          curl -X POST "https://a5b50a5d8484.ngrok-free.app/api/webhooks/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Squark-Signature: ${{ secrets.SQUARK_WEBHOOK_SECRET }}" \
            -d @- <<EOF
          {
            "application_id": "d9baa3a1-b7f7-4760-8ad8-faf482f32af7",
            "cluster_id": "2aef86b2-4d51-4408-b655-ea9bf8812ec0",
            "image": "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}"
          }
          EOF
