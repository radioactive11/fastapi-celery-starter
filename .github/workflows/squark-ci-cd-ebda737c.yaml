name: Squark CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: 971201281248.dkr.ecr.ap-south-2.amazonaws.com
  IMAGE_NAME: 971201281248.dkr.ecr.ap-south-2.amazonaws.com/squark-9bb8c6de/demo-aws-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_EBDA737C }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_EBDA737C }}
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{{ env.IMAGE_NAME }}}"
          REPO_NAME="${REPO_NAME#*/}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" --region ap-south-2 2>/dev/null ||             aws ecr create-repository --repository-name "$REPO_NAME" --region ap-south-2 --image-scanning-configuration scanOnPush=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Squark Deployment
        run: |
          curl -X POST "https://api.squark.cloud/api/webhooks/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Squark-Signature: ${{ secrets.SQUARK_WEBHOOK_SECRET_EBDA737C }}" \
            -d @- <<EOF
          {
            "application_id": "4b3cb231-ba90-4699-b304-51830478be64",
            "cluster_id": "8977b70a-5a2f-4497-a691-a20ddb8f2e1e",
            "image": "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}"
          }
          EOF
