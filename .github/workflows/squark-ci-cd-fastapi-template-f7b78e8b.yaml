name: Squark CI/CD fastapi-template

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: 069102306631.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAME: 069102306631.dkr.ecr.us-east-2.amazonaws.com/squark-9498767a/fastapi-template

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_9498767A }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_9498767A }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          REPO_NAME="${{ env.IMAGE_NAME }}"
          REPO_NAME="${REPO_NAME#*/}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" --region us-east-2 2>/dev/null ||             aws ecr create-repository --repository-name "$REPO_NAME" --region us-east-2 --image-scanning-configuration scanOnPush=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Squark Deployment
        run: |
          curl -X POST "https://api.squark.cloud/api/webhooks/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Squark-Signature: ${{ secrets.SQUARK_WEBHOOK_SECRET_FASTAPI_TEMPLATE_F7B78E8B }}" \
            -d @- <<EOF
          {
            "application_id": "f7b78e8b-daa6-47ec-964a-e9b39786d07b",
            "cluster_id": "e5d2b670-3dbf-411f-a250-07b9fd30b3cc",
            "image": "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}"
          }
          EOF
